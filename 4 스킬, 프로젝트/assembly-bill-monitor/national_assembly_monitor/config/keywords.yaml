# 관심 키워드: 의안명에 이 단어가 들어간 법률안을 조사합니다.
# 줄을 추가/삭제하면 다음 [최신 조사]부터 반영됩니다.
keywords:
  - 방송
  - 통신
  - 시청각

# 조사 대상 국회 대수
age: 22

# NEW 배지를 표시할 기간(최초 발견 후 일수)
new_days: 7

# 의안정보시스템 원문 요청 사이 대기 시간(초). 국회 서버 부담을 줄이기 위함
detail_delay_seconds: 0.5

# 프로그램 실행 시 자동 조사 여부(기본: 하지 않음)
auto_sync: false
sync_interval_minutes: 60

# 국회 API 원본 응답을 DB(api_raw_data)에 저장할지 여부(장애 분석용)
save_raw_response: false
