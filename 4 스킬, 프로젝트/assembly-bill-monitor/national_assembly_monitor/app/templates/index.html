<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회 관심 법률안 모니터링</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>국회 관심 법률안 모니터링</h1>
    <button id="sync-btn" type="button">최신 조사</button>
  </div>
  <div class="meta">
    <span id="last-sync">마지막 조사: -</span>
    <span id="sync-progress" class="progress" hidden></span>
  </div>
  <div id="sync-message" class="message" hidden></div>
  <nav class="filters">
    <div id="keyword-chips" class="chips" aria-label="관심 키워드"></div>
    <div class="filter-row">
      <input id="q" type="search" placeholder="의안명 검색">
      <select id="status">
        <option value="">전체 상태</option>
        <option value="pending">계류(처리 전)</option>
        <option value="processed">처리됨</option>
      </select>
      <label class="check"><input id="new-only" type="checkbox"> NEW만</label>
    </div>
  </nav>
</header>

<main>
  <p id="count" class="count"></p>
  <div id="bills"></div>
  <button id="more-btn" type="button" class="more" hidden>더 보기</button>
</main>

<template id="card-tpl">
  <article class="card">
    <div class="badges"></div>
    <h2 class="name"></h2>
    <dl class="info">
      <div><dt>의안번호</dt><dd class="no"></dd></div>
      <div><dt>제안자</dt><dd class="proposer"></dd></div>
      <div><dt>제안일</dt><dd class="date"></dd></div>
      <div><dt>상태</dt><dd class="status"></dd></div>
      <div><dt>소관위원회</dt><dd class="committee"></dd></div>
    </dl>
    <section class="official">
      <h3>■ 제안이유 및 주요내용 <small>국회 의안정보시스템 원문</small></h3>
      <pre class="text collapsed"></pre>
      <button type="button" class="toggle" hidden>펼치기</button>
    </section>
    <a class="link" target="_blank" rel="noopener noreferrer">국회 상세정보</a>
  </article>
</template>

<script src="/static/js/app.js"></script>
</body>
</html>
