# SOURCE_REGISTRY.yaml
# 자료 목록과 처리 방법. 원칙은 AGENTS.md, 실제 자료별 처리는 이 파일이 정한다.
# 읽는 주체: Claude(ingest·lint), 검색 색인기(search.db), MCP 서버(로컬·원격), ChatGPT
# 수정 절차는 AGENTS.md 2.1절을 따른다(①직접 반영 ②승인 후 Claude 반영 ③개별 승인). 다른 AI는 수정하지 않는다.

version: "1.10"
updated: 2026-09-24
root: "J:/AI 자료"

# ── 필드 정의 ─────────────────────────────────────────────
# id                    고유 식별자 (위키 문서 페이지의 registry_id와 연결)
# path                  root 기준 상대경로. '/'로 끝나면 폴더(하위 포함), 아니면 파일
# layer                 canonical_raw(3 source_raw) | normalized(1 documents_md, 2 data_csv) | instruction(4 스킬)
# type                  law | regulation | commentary | casebook | precedent | interpretation
#                       | meeting_minutes | statistics | guide | internal_doc | notes | instruction
#                       | research | news
# canonical             true = 기준본, false = 중복본
# duplicate_of          중복본일 때 기준본 id
# searchable            true면 search.db에 색인
# ingest                wiki(위키로 ingest) | search_only(검색·인용만) | none
# raw_source            대응하는 3 source_raw 경로 (없으면 빈값: 편집·취합 자료)
# period                자료가 포괄하는 기간
# period_use            기준본과 기간이 겹칠 때 이 자료에서 사용할 기간만 지정
# classification        public | internal | unknown
# classification_confirmed  사용자가 보안등급을 확인했으면 true
# remote_allowed        true일 때만 원격(HTTP, ChatGPT) 경로로 제공
# case_namespace        의결번호 이름공간. 형식이 같은 다른 기관 번호(예: 방통위 2010-01-001)가 방심위 번호와 섞이지 않게 한다
# notes                 참고사항

defaults:
  canonical: true
  searchable: true
  classification: unknown
  classification_confirmed: false
  remote_allowed: false        # 기본값은 차단. 사용자가 확인한 자료만 true로 바꾼다.

# 규칙
# 1) remote_allowed: true 는 classification: public 이고 classification_confirmed: true 일 때만 허용한다.
# 2) 파일 단위 항목은 같은 경로를 포함하는 폴더 단위 항목보다 우선한다.
# 3) 목록에 없는 파일은 searchable: false, remote_allowed: false 로 취급하고 lint가 보고한다.

